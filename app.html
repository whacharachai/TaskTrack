<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskTrack</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>TaskTrack</h1>
  <nav id="tabs">
    <button data-view="tasks" class="on">Tasks</button>
    <button data-view="timeline">Timeline</button>
    <button data-view="calendar">Calendar</button>
    <button data-view="report">Report</button>
    <button data-view="users" class="admin-only">Users</button>
  </nav>
  <span id="who"></span>
  <button id="logout" class="link">Log out</button>
</header>

<main>
  <!-- TASKS -->
  <section id="view-tasks">
    <form id="task-form" class="card admin-only">
      <h2 id="task-form-title">New task</h2>
      <input type="hidden" name="id">
      <div class="grid">
        <label>Name<input name="name" required></label>
        <label>Start date<input name="start_date" type="date"></label>
        <label>End date<input name="end_date" type="date"></label>
        <label>Total amount<input name="total_amount" type="number" step="0.01" min="0" value="0"></label>
        <label>Unit<input name="unit" placeholder="m / % / pcs"></label>
        <label>Sub-task of<select name="parent_id" id="parent-select"></select></label>
        <label>Status<select name="status"><option value="active">active</option><option value="done">done</option></select></label>
      </div>
      <label>Remark<textarea name="remark" rows="2"></textarea></label>
      <div class="row">
        <span>Visible to roles:</span>
        <label class="inline"><input type="checkbox" name="roles" value="admin"> admin</label>
        <label class="inline"><input type="checkbox" name="roles" value="user" checked> user</label>
      </div>
      <label>Also assign users<select name="users" id="user-select" multiple size="4"></select></label>
      <div class="row">
        <button type="submit">Save task</button>
        <button type="button" id="task-reset" class="link">clear</button>
        <span id="task-msg" class="error"></span>
      </div>
    </form>

    <div id="task-list"></div>

    <div id="task-detail" class="card hidden">
      <button id="detail-close" class="link">close</button>
      <div id="detail-body"></div>
      <form id="progress-form" class="row">
        <input type="hidden" name="task_id">
        <label>Done amount<input name="done_amount" type="number" step="0.01" min="0" required></label>
        <label>Date<input name="done_date" type="date" required></label>
        <label class="grow">Remark<input name="remark"></label>
        <button type="submit">Add progress</button>
      </form>
      <form id="file-form" class="row">
        <input type="hidden" name="task_id">
        <input type="file" name="files[]" multiple>
        <button type="submit">Attach</button>
      </form>
      <div id="detail-files"></div>
    </div>
  </section>

  <!-- TIMELINE -->
  <section id="view-timeline" class="hidden">
    <h2>Timeline</h2>
    <div id="timeline"></div>
  </section>

  <!-- CALENDAR -->
  <section id="view-calendar" class="hidden">
    <div class="row">
      <button id="cal-prev">&larr;</button>
      <h2 id="cal-title"></h2>
      <button id="cal-next">&rarr;</button>
      <span class="hint">click a day to report progress for that date</span>
    </div>
    <div id="calendar"></div>
  </section>

  <!-- REPORT -->
  <section id="view-report" class="hidden">
    <h2>Progress report</h2>
    <div id="report-table"></div>
    <h3>Completed % over time</h3>
    <div id="chart"></div>
    <h3>Per-task completion</h3>
    <div id="bars"></div>
  </section>

  <!-- USERS -->
  <section id="view-users" class="hidden">
    <h2>Users</h2>
    <form id="user-form" class="card row">
      <input name="username" placeholder="username" required>
      <input name="password" type="password" placeholder="password">
      <select name="role"><option value="user">user</option><option value="admin">admin</option></select>
      <button type="submit">Add</button>
      <span id="user-msg" class="error"></span>
    </form>
    <div id="user-list"></div>
  </section>
</main>

<script src="js/app.js"></script>
</body>
</html>
