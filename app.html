<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>TaskTrack</h1>
  <select id="project-select" title="Project"></select>
  <nav id="tabs">
    <button data-view="tasks" class="on">Tasks</button>
    <button data-view="chat">Chat</button>
    <button data-view="timeline">Timeline</button>
    <button data-view="calendar">Calendar</button>
        <button data-view="projects" class="admin-only">Projects</button>
    <button data-view="users" class="admin-only">Users</button>
  </nav>
  <span id="who"></span>
  <button id="logout" class="link">Log out</button>
</header>

<main>
  <!-- TASKS -->
  <section id="view-tasks">
    <form id="task-form" class="card write-only">
      <h2 id="task-form-title">New task</h2>
      <input type="hidden" name="id">
      <div class="grid">
        <label>Name<input name="name" required></label>
        <label>Start date<input name="start_date" type="date"></label>
        <label>End date<input name="end_date" type="date"></label>
        <label>Total amount<input name="total_amount" type="number" step="0.01" min="0" value="0"></label>
        <label>Unit<input name="unit" placeholder="m / % / pcs"></label>
        <label>Sub-task of<select name="parent_id" id="parent-select"></select></label>
        <label>Status<select name="status"><option value="active">active</option><option value="done">done</option></select></label>
      </div>
      <label>Remark<textarea name="remark" rows="2"></textarea></label>
      <div class="row">
        <button type="submit">Save task</button>
        <button type="button" id="task-reset" class="link">clear</button>
        <span class="hint">who can see this task comes from the project</span>
      </div>
    </form>

    <div id="task-list"></div>

    <div id="task-detail" class="card hidden">
      <button id="detail-close" class="link">close</button>
      <div id="detail-body"></div>
      <form id="progress-form" class="row write-only">
        <input type="hidden" name="task_id">
        <label>Done on this day<input name="done_amount" type="number" step="0.01" min="0" required></label>
        <label>Date<input name="done_date" type="date" required></label>
        <label class="grow">Remark<input name="remark"></label>
        <button type="submit">Add progress</button>
      </form>
      <label class="hint write-only">Attach documents (up to 100 MB each)<input type="file" id="task-files" multiple></label>
      <div id="task-upload" class="hint"></div>
      <div id="detail-files"></div>
    </div>
  </section>

  <!-- CHAT -->
  <section id="view-chat" class="hidden">
    <h2>Chat room</h2>
    <button id="chat-older" class="link hidden">load older messages</button>
    <div id="chat-list" class="chat-list"></div>
    <form id="chat-form" class="card">
      <textarea name="body" rows="3" placeholder="Write a message…"></textarea>
      <label class="hint">Attach files or photos (up to 100 MB each)<input type="file" id="chat-files" multiple></label>
      <div id="chat-upload" class="hint"></div>
      <div class="row">
        <button type="submit">Send</button>
        <span id="chat-msg" class="error"></span>
      </div>
    </form>
  </section>

  <!-- TIMELINE -->
  <section id="view-timeline" class="hidden">
    <h2>Timeline</h2>
    <div id="timeline"></div>
  </section>

  <!-- CALENDAR -->
  <section id="view-calendar" class="hidden">
    <div class="row">
      <button id="cal-prev">&larr;</button>
      <h2 id="cal-title"></h2>
      <button id="cal-next">&rarr;</button>
    </div>
    <div id="calendar"></div>
  </section>


  <!-- PROJECTS -->
  <section id="view-projects" class="hidden">
    <h2>Projects</h2>
    <form id="project-form" class="card">
      <h3 id="project-form-title">New project</h3>
      <input type="hidden" name="id">
      <div class="grid">
        <label>Name<input name="name" required></label>
        <label>Status<select name="status"><option value="active">active</option><option value="archived">archived</option></select></label>
      </div>
      <label>Remark<textarea name="remark" rows="2"></textarea></label>
      <label>Visible to these users</label>
      <div id="project-user-list" class="check-list"></div>
      <p class="hint">Admins always see every project. Pick the people who should see this one.</p>
      <div class="row">
        <button type="submit">Save project</button>
        <button type="button" id="project-reset" class="link">clear</button>
        <span id="project-msg" class="error"></span>
      </div>
    </form>
    <div id="project-list"></div>
  </section>

  <!-- USERS -->
  <section id="view-users" class="hidden">
    <h2>Users</h2>
    <form id="user-form" class="card row">
      <input name="username" placeholder="username" required>
      <input name="password" type="password" placeholder="password">
      <select name="role"><option value="user">user</option><option value="worker">worker</option><option value="admin">admin</option></select>
      <button type="submit">Add</button>
      <span id="user-msg" class="error"></span>
    </form>
    <div id="user-list"></div>
  </section>
</main>

<script src="js/app.js"></script>
</body>
</html>
